name: Sync upstream

# 定时把上游 can1357/oh-my-pi 的 main 合并进本仓库的 main。
# 合并产生 push 后会自动触发 build-centos7.yml 构建。

on:
  schedule:
    - cron: "17 18 * * *" # 每天北京时间 02:17 (UTC 18:17)
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 合并需要完整历史

      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是最新, 无需合并"
            exit 0
          fi
          # GITHUB_TOKEN 是 GitHub App, 没有 workflows 权限, 无法推送对
          # .github/workflows/ 的修改 (remote rejected)。上游 CI 文件对本仓库
          # 无用 (上游的 CI 已在本仓库禁用), 合并时永远保留本仓库的版本。
          # 因此 workflow 冲突属于预期: 只要冲突全部在 .github/workflows 下,
          # 就把整个目录重置为本仓库版本后继续提交; 其他冲突必须人工处理。
          if ! git merge --no-commit --no-ff upstream/main; then
            other=$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' || true)
            if [ -n "$other" ]; then
              git merge --abort
              echo "::error::上游合并非 workflow 冲突, 需人工处理: $other"
              exit 1
            fi
            echo "workflow 冲突, 保留本仓库版本"
          fi
          # 先清空索引里的 workflows, 上游新增的 workflow 文件才不会进入提交
          # (否则推送仍会被 GITHUB_TOKEN 的 workflows 权限拒绝)。
          git rm -r -q -f --cached .github/workflows
          git checkout origin/main -- .github/workflows
          git commit -m "chore: merge upstream main (workflows pinned to ours)"
          git push origin main
